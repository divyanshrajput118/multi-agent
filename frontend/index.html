<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Research Agent</title>
</head>
<body style="background-color: black; color: antiquewhite;">
    <div id="query">
        <h1 id="heading">Welcome to My Research Agent</h1>
        <p>Write Query Here</p>
        <input id="input" type="text" class="query" style="width: 525px; height: 30px">
        <div>▶️<span id="return_id"></span></div>
        <br><br>
        <button id="button" type="submit" style="width: 100px; height: 30px; color: rgb(216, 223, 208); background: hsl(313, 100%, 21%); border-radius: 85px;">Submit</button>
        <br><br>
        <p>Enter Task Id Here</p>
        <input id="task_id" style="width: 525px; height: 30px">
        <br><br>
        <button id="check" style="width: 100px; height: 30px; color: rgb(216, 223, 208); background: hsl(313, 100%, 21%); border-radius: 85px;">Check Status</button>
        <br><br>
        <div id="status">Your status: </div>
        <br><br><br>
        <button id="download-button" style="display:none;">Download report</button>
        <div id="download"></div>
        
    </div>
<script src="script.js"></script>
</body>
</html>
